# Local stack without a GPU: the gateway in front of four simulated vLLM
# replicas (llm-d-inference-sim), plus Prometheus and Grafana.
#
#   make up      # build and start
#   make down
#
# The simulator mirrors vLLM's OpenAI API and its vllm:* metrics, and with
# --enable-kvcache it models prefix-cache hits: cached prompt tokens skip the
# per-token prefill time, which is what prefix-aware routing exploits.
name: vsi-local

x-sim: &sim
  image: ghcr.io/llm-d/llm-d-inference-sim:v0.9.0
  # The simulator dials out to publish KV-cache events, under the topic
  # kv@<POD_IP>:8000@<model>; kvrelay fans them out to the gateways, which
  # attribute them by that topic. (vLLM instead binds its own publisher.)
  command: >-
    --model qwen3-8b-sim --port 8000
    --max-num-seqs ${SIM_MAX_NUM_SEQS:-32} --time-factor-under-load ${SIM_LOAD_FACTOR:-1.0}
    --max-model-len 8192
    --latency-calculator per-token --prefill-overhead 20ms --prefill-time-per-token 1ms
    --inter-token-latency 20ms
    --enable-kvcache --kv-cache-size 2048 --block-size 16
    --zmq-endpoint tcp://kvrelay:5557 --event-batch-size 1

services:
  sim-0: { <<: *sim, environment: { POD_IP: sim-0 }, ports: ["18000:8000"], depends_on: [kvrelay] }
  sim-1: { <<: *sim, environment: { POD_IP: sim-1 }, ports: ["18001:8000"], depends_on: [kvrelay] }
  sim-2: { <<: *sim, environment: { POD_IP: sim-2 }, ports: ["18002:8000"], depends_on: [kvrelay] }
  sim-3: { <<: *sim, environment: { POD_IP: sim-3 }, ports: ["18003:8000"], depends_on: [kvrelay] }

  kvrelay:
    build:
      context: ../..
    entrypoint: ["/usr/local/bin/kvrelay"]

  gateway:
    build:
      context: ../..
    # VSI_GATEWAY_CONFIG picks a config under deploy/local (default gateway.yaml).
    command: ["-config", "/etc/vsi/${VSI_GATEWAY_CONFIG:-gateway.yaml}"]
    environment:
      VSI_ADMIN_TOKEN: local-dev-token
      # Switch policies without editing files:
      #   VSI_SCHEDULER_POLICY=prefix-aware docker compose ... up -d gateway
      VSI_SCHEDULER_POLICY: ${VSI_SCHEDULER_POLICY:-}
    volumes:
      - ./:/etc/vsi:ro
    ports:
      - "8080:8080"
    depends_on: [sim-0, sim-1, sim-2, sim-3]

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
