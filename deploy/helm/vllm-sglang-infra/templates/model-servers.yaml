{{- if .Values.sim.enabled }}
# Simulated model servers. They dial out to publish KV-cache events, so
# kvrelay fans the events in for the gateways.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vsi.fullname" . }}-sim
  labels: {{- include "vsi.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.sim.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, vsi.io/role: model-server }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, vsi.io/role: model-server, vsi.io/engine: sim }
      annotations:
        vsi.io/kv_events: tcp://{{ include "vsi.fullname" . }}-kvrelay:5558
    spec:
      containers:
        - name: sim
          image: {{ .Values.sim.image }}
          args:
            - --model={{ .Values.sim.model }}
            - --port=8000
            - --zmq-endpoint=tcp://{{ include "vsi.fullname" . }}-kvrelay:5557
            {{- range .Values.sim.args }}
            - {{ . }}
            {{- end }}
          env:
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
          ports: [{ name: http, containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 2 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vsi.fullname" . }}-kvrelay
  labels: {{- include "vsi.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, vsi.io/role: kvrelay }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, vsi.io/role: kvrelay }
    spec:
      containers:
        - name: kvrelay
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/kvrelay"]
          ports: [{ containerPort: 5557 }, { containerPort: 5558 }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vsi.fullname" . }}-kvrelay
  labels: {{- include "vsi.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, vsi.io/role: kvrelay }
  ports:
    - { name: publishers, port: 5557 }
    - { name: subscribers, port: 5558 }
{{- end }}
{{- if .Values.vllm.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vsi.fullname" . }}-vllm
  labels: {{- include "vsi.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.vllm.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, vsi.io/role: model-server }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, vsi.io/role: model-server, vsi.io/engine: vllm }
      annotations:
        vsi.io/kv_events: "pod:5557"
    spec:
      terminationGracePeriodSeconds: {{ .Values.vllm.terminationGracePeriodSeconds }}
      containers:
        - name: vllm
          image: {{ .Values.vllm.image }}
          args:
            - --model={{ .Values.vllm.model }}
            - --port=8000
            {{- range .Values.vllm.args }}
            - {{ . | quote }}
            {{- end }}
          ports: [{ name: http, containerPort: 8000 }, { name: kv-events, containerPort: 5557 }]
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 5 }
          resources: {{- toYaml .Values.vllm.resources | nindent 12 }}
{{- end }}
