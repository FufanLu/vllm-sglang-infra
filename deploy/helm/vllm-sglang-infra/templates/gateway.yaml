{{- $cfg := deepCopy .Values.gateway.config -}}
{{- if and $cfg.autoscale.enabled (not $cfg.autoscale.kubernetes.deployment) -}}
{{- $_ := set $cfg.autoscale.kubernetes "deployment" (include "vsi.modelDeployment" .) -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vsi.fullname" . }}-gateway
  labels: {{- include "vsi.labels" . | nindent 4 }}
data:
  gateway.yaml: |
{{ toYaml $cfg | indent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vsi.fullname" . }}-admin
  labels: {{- include "vsi.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.gateway.adminToken | default (randAlphaNum 32) | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vsi.fullname" . }}-gateway
  labels: {{- include "vsi.labels" . | nindent 4 }}
---
# Discovery lists model-server pods; the autoscaler scales their Deployment.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "vsi.fullname" . }}-gateway
  labels: {{- include "vsi.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "vsi.fullname" . }}-gateway
  labels: {{- include "vsi.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "vsi.fullname" . }}-gateway
subjects:
  - kind: ServiceAccount
    name: {{ include "vsi.fullname" . }}-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vsi.fullname" . }}-gateway
  labels: {{- include "vsi.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, vsi.io/role: gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, vsi.io/role: gateway }
      annotations:
        checksum/config: {{ toYaml $cfg | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.gateway.port }}"
    spec:
      serviceAccountName: {{ include "vsi.fullname" . }}-gateway
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-config", "/etc/vsi/gateway.yaml"]
          ports: [{ name: http, containerPort: {{ .Values.gateway.port }} }]
          env:
            - name: VSI_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: {{ include "vsi.fullname" . }}-admin, key: token } }
            {{- with .Values.gateway.env }}{{ toYaml . | nindent 12 }}{{- end }}
          volumeMounts: [{ name: config, mountPath: /etc/vsi }]
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 2 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: { name: {{ include "vsi.fullname" . }}-gateway }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vsi.fullname" . }}-gateway
  labels: {{- include "vsi.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, vsi.io/role: gateway }
  ports: [{ name: http, port: 80, targetPort: http }]
