# Gateway image: built from this repository's Dockerfile.
image:
  repository: vsi-gateway
  tag: dev
  pullPolicy: IfNotPresent

gateway:
  replicas: 1
  port: 8080
  # Admin API token; leave empty to generate one into the release's Secret.
  adminToken: ""
  resources:
    requests: { cpu: 250m, memory: 128Mi }
    limits: { memory: 512Mi }
  # Extra environment (e.g. provider API keys referenced by api_key_env).
  env: []
  # gateway.yaml. Model servers are discovered by pod label; the selector
  # below matches the simulator and vLLM Deployments of this chart.
  config:
    listen: ":8080"
    scheduler:
      policy: prefix-aware
    flow:
      enabled: true
      max_inflight_per_endpoint: 32
    discovery:
      kubernetes:
        enabled: true
        selector: "vsi.io/role=model-server"
        port: 8000
        interval: 5s
    autoscale:
      enabled: false
      provider: kubernetes
      min: 1
      max: 4
      target_inflight_per_replica: 16
      kubernetes:
        deployment: "" # defaults to the chart's model-server Deployment
        selector: "vsi.io/role=model-server"

# Simulated model servers (llm-d-inference-sim) for clusters without GPUs.
sim:
  enabled: true
  replicas: 4
  image: ghcr.io/llm-d/llm-d-inference-sim:v0.9.0
  model: qwen3-8b-sim
  args:
    - --max-num-seqs=32
    - --max-model-len=8192
    - --latency-calculator=per-token
    - --prefill-overhead=20ms
    - --prefill-time-per-token=1ms
    - --inter-token-latency=20ms
    - --enable-kvcache
    - --kv-cache-size=2048
    - --block-size=16
    - --event-batch-size=1

# Real vLLM model servers. Needs GPU nodes and the NVIDIA device plugin.
vllm:
  enabled: false
  replicas: 2
  image: vllm/vllm-openai:v0.26.0
  model: Qwen/Qwen3-8B
  args:
    - --max-model-len=16384
    - --enable-prompt-tokens-details
    - --kv-events-config={"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"tcp://*:5557"}
  resources:
    limits: { nvidia.com/gpu: 1 }
  # Drain before the pod is killed: no new work arrives once the pod is
  # unready, and in-flight requests get this long to finish.
  terminationGracePeriodSeconds: 300
